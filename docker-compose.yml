services:
  postgres:
    image: postgres:16-alpine
    container_name: roommate-hub-postgres
    environment:
      POSTGRES_USER: roommate
      POSTGRES_PASSWORD: roommate_secret
      POSTGRES_DB: roommate_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommate -d roommate_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: roommate-hub-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://roommate:roommate_secret@postgres:5432/roommate_hub
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: roommate-hub-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  pgdata:
